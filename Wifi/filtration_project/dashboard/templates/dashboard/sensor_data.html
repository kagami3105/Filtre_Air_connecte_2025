{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Données capteurs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
</head>
<body>
  <h2>Données capteurs</h2>

  <canvas id="sensorChart" width="600" height="300"></canvas>

  <script>
    const chartData = JSON.parse('{{ chart_data|escapejs }}');

    const ctx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.labels,
        datasets: [{
          label: 'Température (°C)',
          data: chartData.values,
          borderColor: 'rgba(75, 192, 192, 1)',
          backgroundColor: 'rgba(75, 192, 192, 0.2)',
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });
  </script>

  <table>
    <tr><th>Type</th><th>Valeur</th><th>Unité</th><th>Horodatage</th></tr>
    {% for d in data %}
      <tr>
        <td>{{ d.sensor_type }}</td>
        <td>{{ d.value }}</td>
        <td>{{ d.unit }}</td>
        <td>{{ d.timestamp|date:"H:i:s d/m/Y" }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Aucune donnée reçue</td></tr>
    {% endfor %}
  </table>

  <canvas id="sensorChart" width="600" height="300"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('sensorChart').getContext('2d');
  const sensorChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Température (°C)',
        data: [],
        borderColor: 'rgba(75, 192, 192, 1)',
        backgroundColor: 'rgba(75, 192, 192, 0.2)',
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: false }
      }
    }
  });

  function updateChart() {
    fetch('/sensor-data/json/')
      .then(response => response.json())
      .then(data => {
        sensorChart.data.labels = data.labels;
        sensorChart.data.datasets[0].data = data.values;
        sensorChart.update();
      });
  }

  updateChart(); // initial
  setInterval(updateChart, 10000); // toutes les 10 secondes
</script>
</body>
</html>
