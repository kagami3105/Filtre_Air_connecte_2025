{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>

  <title>{{ title }}</title>
  <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
</head>
<body>

    <a href="{% url 'dashboard:dashboard' %}">Retour</a>
  </form>
</body>
</html>
